<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#12203a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ff0ff" />
      <stop offset="100%" stop-color="#22b8d6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Safe zone for maskable icons: everything meaningful stays inside the
       centre 80%, so a circular Android mask never clips the mark. -->
  <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <circle cx="256" cy="256" r="104" stroke-width="14" opacity="0.95" />
    <path d="M256 106 A150 150 0 0 1 406 256" stroke-width="18" opacity="0.75" />
    <path d="M256 406 A150 150 0 0 1 106 256" stroke-width="18" opacity="0.75" />
  </g>

  <g fill="#7ff0ff" filter="url(#glow)">
    <circle cx="256" cy="256" r="30" />
    <circle cx="406" cy="256" r="17" opacity="0.9" />
    <circle cx="106" cy="256" r="17" opacity="0.9" />
  </g>
</svg>
